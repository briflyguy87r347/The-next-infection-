name: Godot source validation
on:
  push:
    branches: ["feature/**", "main"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check source files and references
        run: python3 tools/verify_repository.py
      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot-engine
          unzip -q /tmp/godot.zip -d /tmp/godot-engine
          chmod +x /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Headless game startup smoke test
        run: /tmp/godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 180
